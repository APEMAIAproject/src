name: Build and publish PMs prediction intra-urban container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'PMs_prediction_intra_urban/**'
      - '.github/workflows/pms-prediction-intra-urban-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/apemaiaproject/pms-prediction-intra-urban
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.1
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/APEMAIAproject/src
            org.opencontainers.image.description=APEMAIA PM10 intra-urban inference over Bari

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./PMs_prediction_intra_urban
          file: ./PMs_prediction_intra_urban/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
